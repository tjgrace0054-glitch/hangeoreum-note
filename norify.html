<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>한걸음 노트 알림 설정</title>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #f7f7f5;
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #202020;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: white;
      border-radius: 28px;
      padding: 34px 26px;
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .eyebrow {
      font-size: 13px;
      font-weight: 700;
      color: #777;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.3;
    }

    .description {
      margin: 0 0 28px;
      color: #666;
      line-height: 1.7;
      font-size: 15px;
    }

    .notice {
      background: #f4f5f1;
      border-radius: 18px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .notification-title {
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .notification-body {
      font-size: 14px;
      color: #555;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 52px;
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 0 16px;
      font-size: 17px;
      outline: none;
      margin-bottom: 14px;
    }

    input:focus {
      border-color: #555;
    }

    button {
      width: 100%;
      height: 56px;
      border: 0;
      border-radius: 16px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .status {
      margin-top: 18px;
      min-height: 48px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #f5f5f5;
      font-size: 14px;
      line-height: 1.6;
      display: none;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #eef7ef;
    }

    .status.error {
      background: #fff0f0;
    }

    .small {
      margin-top: 20px;
      font-size: 12px;
      line-height: 1.7;
      color: #888;
    }

  </style>

</head>


<body>

  <div class="page">

    <div class="card">

      <div class="eyebrow">
        교사용 설정
      </div>


      <h1>
        한걸음 노트 알림
      </h1>


      <p class="description">
        이 휴대폰을 한 번 등록하면
        누군가 새로운 한걸음 노트를 작성했을 때
        휴대폰으로 알림을 받을 수 있습니다.
      </p>


      <div class="notice">

        <div class="notification-title">
          한걸음 노트
        </div>

        <div class="notification-body">
          한걸음 노트를 작성했어요!
        </div>

      </div>


      <label for="pin">
        교사 인증번호
      </label>


      <input
        id="pin"
        type="password"
        inputmode="numeric"
        maxlength="4"
        placeholder="인증번호 입력"
      >


      <button
        id="registerButton"
        type="button"
      >
        이 휴대폰에서 알림 받기
      </button>


      <div
        id="status"
        class="status"
      ></div>


      <div class="small">
        이 설정은 알림을 받을 선생님 휴대폰에서만 하면 됩니다.
        아이들의 휴대폰에서는 별도로 설정할 필요가 없습니다.
      </div>

    </div>

  </div>


  <!-- Firebase -->

  <script
    src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"
  ></script>

  <script
    src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"
  ></script>


  <script>

    /* ========================================================
       Firebase 설정
    ======================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDTNuVYyxKOi6awIo_xEES9ORqEG40gGto",

      authDomain:
        "hangeoreum-note.firebaseapp.com",

      projectId:
        "hangeoreum-note",

      storageBucket:
        "hangeoreum-note.firebasestorage.app",

      messagingSenderId:
        "664829259339",

      appId:
        "1:664829259339:web:4c0eea7dac460cfa0a8e7ce",

      measurementId:
        "G-1CTL24EHQK"

    };


    /*
     * Firebase → Cloud Messaging →
     * 웹 푸시 인증서에서 생성한 공개 VAPID 키
     */
    const VAPID_KEY =
      "BC2wY1FRQ6KqsIpc7qjEMB-riL40aQA2gsmS4aACHFQTsYPXX8n8qQo6u35U1l0OCGdIL-utXXoaiNusyQjJyAo";


    /*
     * 현재 실제 한걸음 노트 Apps Script 주소
     */
    const GAS_WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbzhXOD55ewT4i3WdoSa3WDlAfIsZcLjngiY5NJ6vDJWl-aEJ_I-9KURDlhyNXCM1eqpKQ/exec";


    firebase.initializeApp(
      firebaseConfig
    );


    const messaging =
      firebase.messaging();


    const button =
      document.getElementById(
        "registerButton"
      );


    const pinInput =
      document.getElementById(
        "pin"
      );


    const statusBox =
      document.getElementById(
        "status"
      );


    function showStatus(
      message,
      type
    ) {

      statusBox.textContent =
        message;


      statusBox.className =
        "status show " +
        (type || "");

    }


    button.addEventListener(
      "click",
      async function () {

        const pin =
          pinInput.value.trim();


        if (
          pin.length !== 4
        ) {

          showStatus(
            "교사 인증번호 4자리를 입력해 주세요.",
            "error"
          );

          return;

        }


        button.disabled =
          true;


        button.textContent =
          "등록 중...";


        try {

          /*
           * 브라우저가 알림 기능을 지원하는지 확인
           */
          if (
            !("serviceWorker" in navigator)
          ) {

            throw new Error(
              "이 브라우저에서는 알림 기능을 사용할 수 없습니다."
            );

          }


          if (
            !("Notification" in window)
          ) {

            throw new Error(
              "이 브라우저에서는 알림 기능을 사용할 수 없습니다."
            );

          }


          /*
           * 알림 권한 요청
           */
          const permission =
            await Notification.requestPermission();


          if (
            permission !== "granted"
          ) {

            throw new Error(
              "알림 권한이 허용되지 않았습니다. 브라우저 설정에서 알림을 허용해 주세요."
            );

          }


          showStatus(
            "알림 기기를 등록하고 있습니다.",
            ""
          );


          /*
           * GitHub Pages에 올릴
           * firebase-messaging-sw.js 등록
           */
          const registration =
            await navigator.serviceWorker.register(
              "./firebase-messaging-sw.js"
            );


          await navigator.serviceWorker.ready;


          /*
           * 이 휴대폰의 FCM 토큰 생성
           */
          const token =
            await messaging.getToken({

              vapidKey:
                VAPID_KEY,

              serviceWorkerRegistration:
                registration

            });


          if (!token) {

            throw new Error(
              "휴대폰 알림 토큰을 만들지 못했습니다."
            );

          }


          /*
           * Apps Script 데이터베이스에
           * 이 휴대폰의 토큰 등록
           *
           * 외부 GitHub → Apps Script 요청이라
           * no-cors 모드 사용
           */
          const registerUrl =
            GAS_WEB_APP_URL
            +
            "?action=registerPushToken"
            +
            "&pin="
            +
            encodeURIComponent(
              pin
            )
            +
            "&token="
            +
            encodeURIComponent(
              token
            );


          await fetch(
            registerUrl,
            {
              mode: "no-cors"
            }
          );


          /*
           * 등록 성공
           */
          showStatus(
            "등록되었습니다. 이제 이 휴대폰으로 한걸음 노트 알림이 옵니다.",
            "success"
          );


          button.textContent =
            "알림 등록 완료";


        } catch (error) {

          console.error(
            error
          );


          showStatus(
            error.message ||
            "알림 등록 중 오류가 발생했습니다.",
            "error"
          );


          button.disabled =
            false;


          button.textContent =
            "이 휴대폰에서 알림 받기";

        }

      }
    );


    /*
     * 알림 등록 페이지를 열어둔 상태에서
     * 알림이 도착했을 때
     */
    messaging.onMessage(
      function(payload) {

        console.log(
          "Foreground FCM:",
          payload
        );


        if (
          Notification.permission ===
          "granted"
        ) {

          new Notification(
            "한걸음 노트",
            {
              body:
                "한걸음 노트를 작성했어요!"
            }
          );

        }

      }
    );

  </script>

</body>

</html>
