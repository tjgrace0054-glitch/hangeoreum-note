<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>한걸음 노트 알림 설정</title>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Pretendard",
        "Noto Sans KR",
        sans-serif;
      background: #fffaf0;
      color: #334155;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: white;
      border: 1px solid #fde7b0;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    .icon {
      width: 62px;
      height: 62px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: #f59e0b;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 22px;
      color: #92400e;
    }

    .desc {
      margin: 12px 0 24px;
      text-align: center;
      font-size: 14px;
      line-height: 1.7;
      color: #64748b;
    }

    .status {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 14px;
      padding: 13px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }

    button:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .enable {
      background: #f59e0b;
      color: white;
    }

    .disable {
      background: #f1f5f9;
      color: #475569;
    }

    .back {
      background: white;
      border: 1px solid #e2e8f0;
      color: #64748b;
    }

    .small {
      font-size: 11px;
      color: #94a3b8;
      text-align: center;
      margin-top: 16px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="icon">🔔</div>

    <h1>한걸음 노트 알림</h1>

    <p class="desc">
      다른 친구가 새로운 한걸음 노트를 작성하면<br>
      이 휴대폰으로 알림을 받을 수 있어요.
    </p>

    <div id="status" class="status">
      알림 상태를 확인하고 있어요.
    </div>

    <button
      id="enableBtn"
      class="enable"
      type="button"
    >
      이 휴대폰에서 알림 받기
    </button>

    <button
      id="disableBtn"
      class="disable"
      type="button"
    >
      이 휴대폰 알림 끄기
    </button>

    <button
      id="backBtn"
      class="back"
      type="button"
    >
      한걸음 노트로 돌아가기
    </button>

    <p class="small">
      알림에는 이름, 기도제목, 말씀 내용 등 개인 정보가 표시되지 않습니다.
    </p>

  </div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDTNuVYyxKOj6awIo_xEES9ORqEG40gGto",
  authDomain: "hangeoreum-note.firebaseapp.com",
  projectId: "hangeoreum-note",
  storageBucket: "hangeoreum-note.firebasestorage.app",
  messagingSenderId: "664829259339",
  appId: "1:664829259339:web:4c0eea7dac460cfa0a8e7ce",
  measurementId: "G-1CTL24EHQK"
};


const VAPID_KEY =
  "BC2wY1FRQ6KqsIpc7qjEMB-riL40aQA2gsmS4aACHFQTsYPXX8n8qQo6u35U1l0OCGdIL-utXXoaiNusyQjJyAo";


const GAS_URL =
  "https://script.google.com/macros/s/AKfycbzhXOD55ewT4i3WdoSa3WDlAfIsZcLjngiY5NJ6vDJWl-aEJ_I-9KURDlhyNXCM1eqpKQ/exec";


const APP_URL =
  "https://script.google.com/macros/s/AKfycbzhXOD55ewT4i3WdoSa3WDlAfIsZcLjngiY5NJ6vDJWl-aEJ_I-9KURDlhyNXCM1eqpKQ/exec";


firebase.initializeApp(
  firebaseConfig
);


const messaging =
  firebase.messaging();


const statusBox =
  document.getElementById(
    "status"
  );


const enableBtn =
  document.getElementById(
    "enableBtn"
  );


const disableBtn =
  document.getElementById(
    "disableBtn"
  );


const backBtn =
  document.getElementById(
    "backBtn"
  );


function setStatus(
  message
) {

  statusBox.textContent =
    message;

}


function setBusy(
  busy
) {

  enableBtn.disabled =
    busy;

  disableBtn.disabled =
    busy;

}


async function getMessagingRegistration() {

  if (
    !("serviceWorker" in navigator)
  ) {

    throw new Error(
      "이 브라우저에서는 알림 기능을 사용할 수 없습니다."
    );

  }


  const registration =
    await navigator
      .serviceWorker
      .register(
        "./firebase-messaging-sw.js",
        {
          scope:
            "./push/"
        }
      );


  await navigator
    .serviceWorker
    .ready;


  return registration;

}


async function enableNotifications() {

  try {

    setBusy(
      true
    );


    if (
      !("Notification" in window)
    ) {

      throw new Error(
        "이 브라우저는 알림을 지원하지 않습니다."
      );

    }


    setStatus(
      "알림 권한을 확인하고 있어요."
    );


    const permission =
      await Notification
        .requestPermission();


    if (
      permission !==
      "granted"
    ) {

      setStatus(
        "알림이 허용되지 않았어요. 브라우저 설정에서 알림을 허용해 주세요."
      );

      return;

    }


    setStatus(
      "이 휴대폰을 알림 기기로 등록하고 있어요."
    );


    const registration =
      await getMessagingRegistration();


    const token =
      await messaging
        .getToken({

          vapidKey:
            VAPID_KEY,

          serviceWorkerRegistration:
            registration

        });


    if (!token) {

      throw new Error(
        "알림 기기 정보를 만들지 못했습니다."
      );

    }


    const registerUrl =
      GAS_URL +
      "?action=registerPushToken" +
      "&token=" +
      encodeURIComponent(
        token
      ) +
      "&_=" +
      Date.now();


    await fetch(
      registerUrl,
      {
        method:
          "GET",

        mode:
          "no-cors",

        cache:
          "no-store"
      }
    );


    localStorage.setItem(
      "hangeoreum_push_token",
      token
    );


    localStorage.setItem(
      "hangeoreum_push_enabled",
      "yes"
    );


    setStatus(
      "알림이 켜졌어요. 이제 새로운 한걸음 노트가 작성되면 알림을 받을 수 있어요."
    );

  }
  catch (error) {

    console.error(
      error
    );


    setStatus(
      "알림 설정 중 오류가 발생했어요: " +
      (
        error &&
        error.message
          ? error.message
          : String(error)
      )
    );

  }
  finally {

    setBusy(
      false
    );

  }

}


async function disableNotifications() {

  try {

    setBusy(
      true
    );


    setStatus(
      "알림을 끄고 있어요."
    );


    const savedToken =
      localStorage.getItem(
        "hangeoreum_push_token"
      );


    if (
      savedToken
    ) {

      const unregisterUrl =
        GAS_URL +
        "?action=unregisterPushToken" +
        "&token=" +
        encodeURIComponent(
          savedToken
        ) +
        "&_=" +
        Date.now();


      try {

        await fetch(
          unregisterUrl,
          {
            method:
              "GET",

            mode:
              "no-cors",

            cache:
              "no-store"
          }
        );

      }
      catch (e) {

        console.warn(
          e
        );

      }

    }


    try {

      await messaging
        .deleteToken();

    }
    catch (e) {

      console.warn(
        e
      );

    }


    localStorage.removeItem(
      "hangeoreum_push_token"
    );


    localStorage.removeItem(
      "hangeoreum_push_enabled"
    );


    setStatus(
      "이 휴대폰의 한걸음 노트 알림을 껐어요."
    );

  }
  catch (error) {

    console.error(
      error
    );


    setStatus(
      "알림을 끄는 중 오류가 발생했어요."
    );

  }
  finally {

    setBusy(
      false
    );

  }

}


function refreshStatus() {

  if (
    !("Notification" in window)
  ) {

    setStatus(
      "이 브라우저에서는 알림 기능을 사용할 수 없습니다."
    );

    return;

  }


  const enabled =
    localStorage.getItem(
      "hangeoreum_push_enabled"
    ) ===
    "yes";


  if (
    Notification.permission ===
      "granted" &&
    enabled
  ) {

    setStatus(
      "현재 이 휴대폰의 알림이 켜져 있어요."
    );

  }
  else if (
    Notification.permission ===
      "denied"
  ) {

    setStatus(
      "현재 브라우저에서 알림이 차단되어 있어요."
    );

  }
  else {

    setStatus(
      "현재 이 휴대폰의 한걸음 노트 알림이 꺼져 있어요."
    );

  }

}


enableBtn.addEventListener(
  "click",
  enableNotifications
);


disableBtn.addEventListener(
  "click",
  disableNotifications
);


backBtn.addEventListener(
  "click",
  () => {

    window.location.href =
      APP_URL;

  }
);


refreshStatus();

</script>

</body>
</html>
