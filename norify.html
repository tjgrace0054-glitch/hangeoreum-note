<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta name="theme-color" content="#ffffff">

  <title>한걸음 노트 알림 설정</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f7f5;
      font-family:
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      color: #202020;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      padding: 34px 26px;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    .eyebrow {
      margin-bottom: 10px;
      color: #777;
      font-size: 13px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 28px;
      line-height: 1.3;
    }

    .description {
      margin: 0 0 28px;
      color: #666;
      font-size: 15px;
      line-height: 1.7;
    }

    .notice {
      margin-bottom: 24px;
      padding: 18px;
      background: #f4f5f1;
      border-radius: 18px;
    }

    .notification-title {
      margin-bottom: 5px;
      font-size: 14px;
      font-weight: 800;
    }

    .notification-body {
      color: #555;
      font-size: 14px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 52px;
      margin-bottom: 14px;
      padding: 0 16px;
      border: 1px solid #ddd;
      border-radius: 14px;
      outline: none;
      font-size: 17px;
    }

    input:focus {
      border-color: #555;
    }

    button {
      width: 100%;
      height: 56px;
      border: 0;
      border-radius: 16px;
      background: #222;
      color: #fff;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: default;
    }

    .status {
      display: none;
      min-height: 48px;
      margin-top: 18px;
      padding: 14px 16px;
      background: #f5f5f5;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
    }

    .status.show {
      display: block;
    }

    .status.success {
      background: #eef7ef;
    }

    .status.error {
      background: #fff0f0;
    }

    .small {
      margin-top: 20px;
      color: #888;
      font-size: 12px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

  <div class="page">
    <div class="card">

      <div class="eyebrow">
        교사용 설정
      </div>

      <h1>
        한걸음 노트 알림
      </h1>

      <p class="description">
        이 휴대폰을 한 번 등록하면 누군가 새로운 한걸음 노트를
        작성했을 때 휴대폰으로 알림을 받을 수 있습니다.
      </p>

      <div class="notice">
        <div class="notification-title">
          한걸음 노트
        </div>

        <div class="notification-body">
          한걸음 노트를 작성했어요!
        </div>
      </div>

      <label for="pin">
        교사 인증번호
      </label>

      <input
        id="pin"
        type="password"
        inputmode="numeric"
        maxlength="4"
        placeholder="인증번호 입력"
      >

      <button
        id="registerButton"
        type="button"
      >
        이 휴대폰에서 알림 받기
      </button>

      <div
        id="status"
        class="status"
      ></div>

      <div class="small">
        알림을 받을 선생님 휴대폰에서만 한 번 설정하면 됩니다.
        아이들의 휴대폰에서는 별도로 알림을 등록할 필요가 없습니다.
      </div>

    </div>
  </div>


  <script
    src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"
  ></script>

  <script
    src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"
  ></script>


  <script>

    const firebaseConfig = {
      apiKey:
        "AIzaSyDTNuVYyxKOj6awIo_xEES9ORqEG40gGto",

      authDomain:
        "hangeoreum-note.firebaseapp.com",

      projectId:
        "hangeoreum-note",

      storageBucket:
        "hangeoreum-note.firebasestorage.app",

      messagingSenderId:
        "664829259339",

      appId:
        "1:664829259339:web:4c0eea7dac460cfa0a8e7ce",

      measurementId:
        "G-1CTL24EHQK"
    };


    const VAPID_KEY =
      "BC2wY1FRQ6KqsIpc7qjEMB-riL40aQA2gsmS4aACHFQTsYPXX8n8qQo6u35U1l0OCGdIL-utXXoaiNusyQjJyAo";


    const GAS_WEB_APP_URL =
      "https://script.google.com/macros/s/AKfycbzhXOD55ewT4i3WdoSa3WDlAfIsZcLjngiY5NJ6vDJWl-aEJ_I-9KURDlhyNXCM1eqpKQ/exec";


    firebase.initializeApp(firebaseConfig);

    const messaging =
      firebase.messaging();


    const button =
      document.getElementById("registerButton");

    const pinInput =
      document.getElementById("pin");

    const statusBox =
      document.getElementById("status");


    function showStatus(message, type) {
      statusBox.textContent = message;

      statusBox.className =
        "status show " + (type || "");
    }


    button.addEventListener(
      "click",
      async function () {

        const pin =
          pinInput.value.trim();


        if (pin.length !== 4) {
          showStatus(
            "교사 인증번호 4자리를 입력해 주세요.",
            "error"
          );

          return;
        }


        button.disabled = true;

        button.textContent =
          "등록 중...";


        try {

          if (!("serviceWorker" in navigator)) {
            throw new Error(
              "이 브라우저에서는 알림 기능을 사용할 수 없습니다."
            );
          }


          if (!("Notification" in window)) {
            throw new Error(
              "이 브라우저에서는 알림 기능을 사용할 수 없습니다."
            );
          }


          const permission =
            await Notification.requestPermission();


          if (permission !== "granted") {
            throw new Error(
              "알림 권한이 허용되지 않았습니다. 휴대폰의 브라우저 알림 설정을 확인해 주세요."
            );
          }


          showStatus(
            "알림 기기를 등록하고 있습니다.",
            ""
          );


          /*
           * 기존 sw.js와 충돌하지 않도록
           * Firebase 알림 전용 scope 사용
           */
          const registration =
            await navigator.serviceWorker.register(
              "./firebase-messaging-sw.js",
              {
                scope: "./push/"
              }
            );


          await navigator.serviceWorker.ready;


          const token =
            await messaging.getToken({
              vapidKey: VAPID_KEY,
              serviceWorkerRegistration: registration
            });


          if (!token) {
            throw new Error(
              "휴대폰 알림 정보를 만들지 못했습니다."
            );
          }


          const registerUrl =
            GAS_WEB_APP_URL
            + "?action=registerPushToken"
            + "&pin="
            + encodeURIComponent(pin)
            + "&token="
            + encodeURIComponent(token);


          /*
           * GitHub Pages → Apps Script 외부 요청
           */
          await fetch(
            registerUrl,
            {
              mode: "no-cors",
              cache: "no-store"
            }
          );


          showStatus(
            "등록 요청을 보냈습니다. 이제 실제 알림 테스트를 진행하면 됩니다.",
            "success"
          );


          button.textContent =
            "알림 등록 완료";


        } catch (error) {

          console.error(error);

          showStatus(
            error.message ||
              "알림 등록 중 오류가 발생했습니다.",
            "error"
          );


          button.disabled = false;

          button.textContent =
            "이 휴대폰에서 알림 받기";
        }

      }
    );


    messaging.onMessage(
      function (payload) {

        console.log(
          "Foreground FCM:",
          payload
        );

      }
    );

  </script>

</body>
</html>
